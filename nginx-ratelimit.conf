# Defense-in-depth only: this nginx tier serves the static SPA build and does
# not proxy to Supabase (see nginx.conf), so it can only rate-limit page/asset
# requests, not the RPC calls the browser makes directly to Supabase. Real RPC
# protection lives in Postgres (see supabase/migrations/20260817000000_rate_limiting.sql).
# Kept in its own file (rather than inside default.conf's server{} block)
# because limit_req_zone must be declared at http{} scope; the base
# nginx:1.29-alpine image's nginx.conf does `include /etc/nginx/conf.d/*.conf;`
# inside http{}, so a sibling file in the same directory lands in scope.
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=20r/s;
