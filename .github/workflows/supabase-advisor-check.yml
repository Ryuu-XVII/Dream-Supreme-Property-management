name: Supabase Advisor Check

# Catches drift that happens directly against the live database, between
# pushes — CI on push/PR can never see that. See
# scripts/check-supabase-advisors.mjs for the regression that motivated this.
on:
  schedule:
    - cron: "17 6 * * *" # Daily, off the top of the hour to avoid the fleet-wide :00 spike.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: This workflow is disabled
        run: |
          echo "Supabase Advisor Check workflow is currently disabled"
          exit 0
