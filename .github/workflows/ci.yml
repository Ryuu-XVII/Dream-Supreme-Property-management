name: CI & Test Suite

on:
  push: # Runs automatically on every push to any branch
  pull_request: # Runs on every pull request
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test_and_verify:
    name: Run Vitest & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: "https://placeholder-domain.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder-anon-key-for-testing"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local env for tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env.local
          else
            printf "VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=anon\n" > .env.local
          fi

      - name: Run Vitest Unit Tests
        run: npx vitest run --reporter=verbose --reporter=github-actions

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: Check bundle size budget
        run: npm run check:bundle

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "# 🧪 Test Suite & CI Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` | **Branch:** \`${{ github.ref_name }}\` | **Actor:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Status: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "All Vitest unit tests, TypeScript type checks, ESLint rules, and production builds completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "One or more steps in the pipeline failed. Check the detailed step logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Alert on Pipeline Failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.sha;
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issueTitle = `🚨 CI Test Failure on ${branch} (${commitSha.substring(0, 7)})`;
            const issueBody = `## 🚨 Automated Alert: CI Build / Test Failure

            The automated test pipeline failed on branch \`${branch}\`.

            - **Commit:** [${commitSha.substring(0, 7)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${commitSha})
            - **Triggered By:** @${context.actor}
            - **Workflow Run Logs:** [View Run Details](${runUrl})

            ### Next Steps
            1. Pull the latest code locally.
            2. Run \`npm run check\` in your terminal.
            3. Fix any failing Vitest tests, lint errors, or type errors before pushing again.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'ci-failure']
            });

  e2e_smoke:
    name: E2E Smoke Tests (public routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: "https://placeholder-domain.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder-anon-key-for-testing"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Deliberately scoped to public, unauthenticated routes — see
      # e2e/smoke.spec.ts for why (a real signed-in flow needs a seeded
      # backend this job doesn't have).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  test_property24_sync_worker:
    name: Test property24-sync Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/property24-sync
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/property24-sync/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

  database_checks:
    name: Supabase Database Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail if duplicate Supabase migration versions
        run: |
          if [ -d supabase/migrations ]; then
            dupes=$(ls supabase/migrations | awk -F'_' '{print $1}' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "Duplicate supabase migration versions found:" >&2
              echo "$dupes" >&2
              echo "List of migration files:" >&2
              ls -1 supabase/migrations | awk -F'_' '{print $1, $0}' | sort >&2
              exit 1
            fi
          fi

      - name: Ensure clean Supabase state
        run: |
          supabase stop || true
          docker volume ls -q | grep supabase || true | xargs -r docker volume rm || true

      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint --level warning

      # RLS cross-tenant/cross-deal isolation regression tests (pgTAP) —
      # see supabase/tests/rls_isolation_test.sql for why this exists: two
      # real access-control bugs (commission_allocation/commission_clawback
      # with no agency scoping at all, and a leftover broad policy on
      # bond_application reopening cross-deal visibility) sat live and
      # undetected until a manual advisor-triage pass found them. Nothing
      # else in this job would have caught either — `supabase db lint`
      # checks schema hygiene, not who can see what.
      - run: supabase test db

      # Catches objects that exist in the live database but in no migration.
      # This is how 19 functions -- several of them authorization logic --
      # ended up applied straight to production and reproducible nowhere; see
      # supabase/migrations/20260818000006_reconcile_live_drift.sql.
      #
      # Skips (rather than fails) when the credentials are absent, so forks and
      # PRs from outside the repo are not blocked by a missing secret.
      - name: Check live schema matches migrations
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning title=Schema drift check skipped::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID to enable it."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          node scripts/check-schema-drift.mjs
