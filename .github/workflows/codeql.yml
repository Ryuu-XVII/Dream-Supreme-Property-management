name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 4 * * 1" # Weekly, Monday, off the top of the hour.

permissions:
  contents: read
  security-events: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: This workflow is disabled
        run: |
          echo "CodeQL workflow is currently disabled"
          exit 0
